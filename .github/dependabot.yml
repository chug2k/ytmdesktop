version: 2
updates:
  # The real dependency surface lives in Cargo now.
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    target-branch: "development"
    open-pull-requests-limit: 5
    labels:
      - "Dependencies"
    commit-message:
      prefix: "⬆️ "

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "development"
    open-pull-requests-limit: 5
    labels:
      - "Dependencies"
    commit-message:
      prefix: "⬆️ "

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "development"
    labels:
      - "Dependencies"
    commit-message:
      prefix: "⬆️ "
